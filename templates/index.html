<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Photo Trace</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /*
         * Photo popup
         */

        .photo-popup img {
            display: block;
            width: 280px;
            max-width: 100%;
            margin-bottom: 8px;
        }

        .photo-popup .date {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        .popup-photo {
            cursor: zoom-in;
        }

        /*
         * Fullscreen photo viewer
         */

        .photo-lightbox {
            display: none;

            position: fixed;
            inset: 0;

            z-index: 9999;

            background: rgba(0, 0, 0, 0.92);

            align-items: center;
            justify-content: center;

            padding: 30px;
            box-sizing: border-box;

            cursor: zoom-out;
        }

        .photo-lightbox.visible {
            display: flex;
        }

        .photo-lightbox img {
            max-width: 100%;
            max-height: 100%;

            object-fit: contain;

            cursor: default;

            border-radius: 4px;
        }

        .photo-lightbox-close {
            position: absolute;

            top: 15px;
            right: 20px;

            width: 44px;
            height: 44px;

            border: none;
            background: transparent;

            color: white;

            font-size: 36px;
            line-height: 1;

            cursor: pointer;

            z-index: 10000;
        }

        .photo-lightbox-close:hover {
            opacity: 0.7;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <!-- Fullscreen photo viewer -->

    <div
        id="photo-lightbox"
        class="photo-lightbox"
    >
        <button
            id="photo-lightbox-close"
            class="photo-lightbox-close"
            aria-label="Close photo"
        >
            ×
        </button>

        <img
            id="photo-lightbox-image"
            src=""
            alt=""
        >
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>

        /*
         * Photo data generated by Go
         */

        const photos = {{ .PhotosJSON }};


        /*
         * Initialize map
         */

        const map = L.map("map");


        /*
         * OpenStreetMap tiles
         */

        L.tileLayer(
            "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
            {
                attribution: "&copy; OpenStreetMap contributors"
            }
        ).addTo(map);


        /*
         * Fullscreen photo viewer
         */

        const lightbox =
            document.getElementById("photo-lightbox");

        const lightboxImage =
            document.getElementById("photo-lightbox-image");

        const lightboxClose =
            document.getElementById("photo-lightbox-close");


        function openLightbox(src, alt) {

            lightboxImage.src = src;
            lightboxImage.alt = alt;

            lightbox.classList.add("visible");

            document.body.style.overflow = "hidden";
        }


        function closeLightbox() {

            lightbox.classList.remove("visible");

            lightboxImage.src = "";

            document.body.style.overflow = "";
        }


        /*
         * Close button
         */

        lightboxClose.addEventListener(
            "click",
            closeLightbox
        );


        /*
         * Close when clicking the dark background
         */

        lightbox.addEventListener(
            "click",
            (event) => {

                if (event.target === lightbox) {
                    closeLightbox();
                }

            }
        );


        /*
         * Close with Escape
         */

        document.addEventListener(
            "keydown",
            (event) => {

                if (event.key === "Escape") {
                    closeLightbox();
                }

            }
        );


        /*
         * No photos
         */

        if (photos.length === 0) {

            map.setView(
                [0, 0],
                2
            );

        } else {

            /*
             * Build coordinates for the track
             */

            const coordinates =
                photos.map(
                    photo => [
                        photo.latitude,
                        photo.longitude
                    ]
                );


            /*
             * Draw the track
             */

            const track =
                L.polyline(
                    coordinates,
                    {
                        weight: 4,
                        opacity: 0.8
                    }
                ).addTo(map);


            /*
             * Create photo markers
             */

            photos.forEach(
                (photo, index) => {

                    let altitude = "";

                    if (
                        photo.altitude !== undefined
                    ) {

                        altitude =
                            `<div>
                                ${Math.round(photo.altitude)} m
                            </div>`;

                    }


                    /*
                     * Photo path
                     */

                    const photoPath =
                        `photos/${encodeURIComponent(
                            photo.filename
                        )}`;


                    /*
                     * Popup content
                     */

                    const popup = `
                        <div class="photo-popup">

                            <img
                                src="${photoPath}"
                                alt="${photo.filename}"
                                class="popup-photo"
                                onclick="openLightbox(
                                    '${photoPath}',
                                    '${photo.filename}'
                                )"
                            >

                            <strong>
                                ${photo.filename}
                            </strong>

                            <div class="date">
                                ${new Date(
                                    photo.timestamp
                                ).toLocaleString()}
                            </div>

                            ${altitude}

                        </div>
                    `;


                    /*
                     * Marker
                     */

                    const marker =
                        L.marker(
                            [
                                photo.latitude,
                                photo.longitude
                            ]
                        ).addTo(map);


                    /*
                     * Popup
                     */

                    marker.bindPopup(popup);

                }
            );


            /*
             * Fit map to the entire track
             */

            map.fitBounds(
                track.getBounds(),
                {
                    padding: [40, 40]
                }
            );

        }

    </script>

</body>

</html>
